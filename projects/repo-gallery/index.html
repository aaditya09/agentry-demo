<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>aaditya09 · Repositories</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-soft: #11151d;
    --card: #151a24;
    --card-hover: #1b2130;
    --border: #232a38;
    --text: #e8ecf3;
    --text-dim: #8b93a7;
    --accent: #7c9dff;
    --accent-soft: rgba(124,157,255,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at 20% -10%, #1a2233 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 56px 24px 32px;
    text-align: center;
  }
  header h1 {
    font-size: clamp(28px, 4vw, 42px);
    margin: 0 0 8px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header h1 span {
    background: linear-gradient(90deg, #7c9dff, #a97cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    color: var(--text-dim);
    margin: 0;
    font-size: 15px;
  }
  .controls {
    max-width: 900px;
    margin: 28px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }
  .search {
    flex: 1;
    min-width: 220px;
    max-width: 420px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 16px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--text-dim); }
  select {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    cursor: pointer;
  }
  .stats {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin: 18px 0 0;
  }
  .grid {
    max-width: 1100px;
    margin: 28px auto 80px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .card:hover {
    background: var(--card-hover);
    border-color: #313c52;
    transform: translateY(-3px);
  }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card-name {
    font-weight: 600;
    font-size: 16px;
    word-break: break-word;
  }
  .card-name svg { vertical-align: -3px; margin-right: 6px; opacity: .55; }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
    font-weight: 600;
  }
  .card-desc {
    color: var(--text-dim);
    font-size: 13.5px;
    line-height: 1.45;
    min-height: 20px;
    flex: 1;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12.5px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .lang-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 5px;
    vertical-align: -1px;
  }
  .meta-item { display: flex; align-items: center; gap: 4px; }
  .meta-item svg { opacity: .6; }
  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    grid-column: 1 / -1;
  }
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
    padding: 0 24px 40px;
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<header>
  <h1>aaditya09's <span>Repositories</span></h1>
  <p>A live snapshot of public GitHub repositories, fetched via the GitHub REST API.</p>
</header>

<div class="controls">
  <input class="search" id="search" type="text" placeholder="Search repositories…" />
  <select id="sort">
    <option value="updated">Recently updated</option>
    <option value="created">Recently created</option>
    <option value="name">Name (A–Z)</option>
    <option value="stars">Most stars</option>
  </select>
  <select id="langFilter">
    <option value="">All languages</option>
  </select>
</div>

<div class="stats" id="stats"></div>

<div class="grid" id="grid"></div>

<footer>
  Built with the GitHub REST API · <a href="https://github.com/aaditya09" target="_blank" rel="noopener">github.com/aaditya09</a>
</footer>

<script>
  const REPOS = [{"name": "test", "description": "test", "language": "Python", "stars": 0, "forks": 0, "updated": "2026-09-06T19:08:26Z", "created": "2019-11-13T16:05:51Z", "url": "https://github.com/aaditya09/test", "private": false}, {"name": "kong-local", "description": "Local test kong plugins repo", "language": "", "stars": 0, "forks": 0, "updated": "2026-02-10T09:20:05Z", "created": "2026-02-10T09:20:00Z", "url": "https://github.com/aaditya09/kong-local", "private": false}, {"name": "fluent-plugin-encrypt", "description": "Fluentd plugin for encrypting the log messages", "language": "", "stars": 0, "forks": 0, "updated": "2023-04-25T07:35:06Z", "created": "2023-04-25T07:35:05Z", "url": "https://github.com/aaditya09/fluent-plugin-encrypt", "private": false}, {"name": "petclinic-app", "description": "", "language": "", "stars": 0, "forks": 0, "updated": "2021-12-14T12:27:21Z", "created": "2021-11-24T19:22:34Z", "url": "https://github.com/aaditya09/petclinic-app", "private": false}, {"name": "crossplane-postgres-package", "description": "", "language": "", "stars": 0, "forks": 0, "updated": "2021-12-13T00:53:42Z", "created": "2021-12-13T00:52:28Z", "url": "https://github.com/aaditya09/crossplane-postgres-package", "private": false}, {"name": "snakeandladder", "description": "Snake and Ladder", "language": "Java", "stars": 0, "forks": 1, "updated": "2019-11-13T12:29:11Z", "created": "2019-11-12T17:08:19Z", "url": "https://github.com/aaditya09/snakeandladder", "private": false}, {"name": "parking-lot", "description": "", "language": "Java", "stars": 0, "forks": 0, "updated": "2019-08-09T01:46:28Z", "created": "2019-08-07T05:13:27Z", "url": "https://github.com/aaditya09/parking-lot", "private": false}, {"name": "task_planner", "description": "", "language": "Java", "stars": 0, "forks": 0, "updated": "2019-07-24T23:02:36Z", "created": "2019-07-23T21:44:50Z", "url": "https://github.com/aaditya09/task_planner", "private": false}, {"name": "escape_h2", "description": "", "language": "Java", "stars": 0, "forks": 0, "updated": "2019-07-23T16:28:53Z", "created": "2019-07-23T16:15:28Z", "url": "https://github.com/aaditya09/escape_h2", "private": false}, {"name": "escape", "description": "", "language": "Java", "stars": 0, "forks": 0, "updated": "2019-07-18T05:34:02Z", "created": "2019-07-14T04:15:14Z", "url": "https://github.com/aaditya09/escape", "private": false}, {"name": "Microservices-JWT-Zuul-Kafka-docker", "description": "This repository helps beginners to get started with microservices , which has auth service which provides jwt token and api gateway to have jwt valdiation and to route the api requests.All this setup is dockerized as well.", "language": "Java", "stars": 0, "forks": 0, "updated": "2018-10-22T15:52:28Z", "created": "2018-10-22T15:52:25Z", "url": "https://github.com/aaditya09/Microservices-JWT-Zuul-Kafka-docker", "private": false}, {"name": "myi3config", "description": "", "language": "", "stars": 0, "forks": 0, "updated": "2018-09-24T17:27:49Z", "created": "2018-09-24T17:27:28Z", "url": "https://github.com/aaditya09/myi3config", "private": false}, {"name": "myemacsconfig", "description": "My emacs configuration ", "language": "Emacs Lisp", "stars": 0, "forks": 0, "updated": "2018-09-09T09:02:43Z", "created": "2018-09-09T08:46:46Z", "url": "https://github.com/aaditya09/myemacsconfig", "private": false}, {"name": "termite-install", "description": "A termite installation script for Ubuntu users (and other Ubuntu-based distributions)", "language": "Dockerfile", "stars": 0, "forks": 0, "updated": "2018-07-29T20:11:54Z", "created": "2018-07-29T20:09:05Z", "url": "https://github.com/aaditya09/termite-install", "private": false}, {"name": "openstack", "description": "Repository containing OpenStack repositories", "language": "", "stars": 0, "forks": 0, "updated": "2018-06-06T13:14:46Z", "created": "2018-06-06T13:14:41Z", "url": "https://github.com/aaditya09/openstack", "private": false}, {"name": "frontend", "description": "", "language": "JavaScript", "stars": 0, "forks": 0, "updated": "2018-05-29T06:28:54Z", "created": "2018-05-29T06:28:52Z", "url": "https://github.com/aaditya09/frontend", "private": false}, {"name": "server", "description": "", "language": "Python", "stars": 0, "forks": 0, "updated": "2018-05-28T10:36:27Z", "created": "2018-05-28T10:36:25Z", "url": "https://github.com/aaditya09/server", "private": false}, {"name": "ruby-ex", "description": "", "language": "Ruby", "stars": 0, "forks": 0, "updated": "2016-09-22T02:13:14Z", "created": "2016-09-22T02:13:13Z", "url": "https://github.com/aaditya09/ruby-ex", "private": false}];

  const LANG_COLORS = {
    JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5', Java: '#b07219',
    Ruby: '#701516', Go: '#00ADD8', Rust: '#dea584', 'Emacs Lisp': '#c065db',
    Dockerfile: '#384d54', HTML: '#e34c26', CSS: '#563d7c', Shell: '#89e051',
    C: '#555555', 'C++': '#f34b7d', 'C#': '#178600', PHP: '#4F5D95', Kotlin: '#A97BFF',
  };
  function langColor(l) { return LANG_COLORS[l] || '#8b93a7'; }

  function timeAgo(iso) {
    const d = new Date(iso);
    const days = Math.floor((Date.now() - d.getTime()) / 86400000);
    if (days < 1) return 'today';
    if (days < 30) return days + 'd ago';
    if (days < 365) return Math.floor(days / 30) + 'mo ago';
    return Math.floor(days / 365) + 'y ago';
  }

  const grid = document.getElementById('grid');
  const stats = document.getElementById('stats');
  const searchInput = document.getElementById('search');
  const sortSelect = document.getElementById('sort');
  const langSelect = document.getElementById('langFilter');

  const langs = [...new Set(REPOS.map(r => r.language).filter(Boolean))].sort();
  for (const l of langs) {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    langSelect.appendChild(opt);
  }

  const starIcon = '<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>';
  const forkIcon = '<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 2.122a2.25 2.25 0 1 0-1.5 0v.878A2.25 2.25 0 0 0 5.75 8.5h1.5v2.128a2.251 2.251 0 1 0 1.5 0V8.5h1.5a2.25 2.25 0 0 0 2.25-2.25v-.878a2.25 2.25 0 1 0-1.5 0v.878a.75.75 0 0 1-.75.75h-4.5a.75.75 0 0 1-.75-.75v-.878ZM11 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM8.75 12.75a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/></svg>';
  const clockIcon = '<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM1.5 8a6.5 6.5 0 1 1 13 0 6.5 6.5 0 0 1-13 0Zm7-3.25v2.992l2.028 1.16a.75.75 0 1 1-.744 1.302l-2.5-1.43A.75.75 0 0 1 7.5 8V4.75a.75.75 0 0 1 1.5 0Z"/></svg>';
  const repoIcon = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8Z"/></svg>';

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const lang = langSelect.value;
    const sort = sortSelect.value;

    let list = REPOS.filter(r => {
      const matchQ = !q || r.name.toLowerCase().includes(q) || (r.description || '').toLowerCase().includes(q);
      const matchLang = !lang || r.language === lang;
      return matchQ && matchLang;
    });

    list.sort((a, b) => {
      if (sort === 'name') return a.name.localeCompare(b.name);
      if (sort === 'stars') return b.stars - a.stars;
      if (sort === 'created') return new Date(b.created) - new Date(a.created);
      return new Date(b.updated) - new Date(a.updated);
    });

    stats.textContent = `${list.length} of ${REPOS.length} repositories`;

    grid.innerHTML = '';
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">No repositories match your search.</div>';
      return;
    }

    for (const r of list) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = r.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `
        <div class="card-top">
          <div class="card-name">${repoIcon} ${r.name}</div>
          ${r.language ? `<span class="badge">${r.language}</span>` : ''}
        </div>
        <div class="card-desc">${r.description ? r.description : '<em style="opacity:.5">No description</em>'}</div>
        <div class="card-meta">
          ${r.language ? `<span class="meta-item"><span class="lang-dot" style="background:${langColor(r.language)}"></span>${r.language}</span>` : ''}
          <span class="meta-item">${starIcon} ${r.stars}</span>
          <span class="meta-item">${forkIcon} ${r.forks}</span>
          <span class="meta-item">${clockIcon} ${timeAgo(r.updated)}</span>
        </div>
      `;
      grid.appendChild(a);
    }
  }

  searchInput.addEventListener('input', render);
  sortSelect.addEventListener('change', render);
  langSelect.addEventListener('change', render);
  render();
</script>
</body>
</html>
